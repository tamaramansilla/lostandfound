```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Santa Cruz Pet Watch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            🐾 Santa Cruz Pet Watch
        </div>

        <p>
            Helping lost pets find their way home.
        </p>

    </header>


    <main>

        <!-- AREA NAVIGATION -->

        <section class="area-navigation">

            <button class="area-button active" data-area="All">
                All Areas
            </button>

            <button class="area-button" data-area="Equipetrol">
                Equipetrol
            </button>

            <button class="area-button" data-area="Pirai">
                Pirai
            </button>

            <button class="area-button" data-area="Urubo">
                Urubo
            </button>

            <button class="area-button" data-area="Sirari">
                Sirari
            </button>

        </section>


        <!-- FILTERS -->

        <section class="filters">

            <div>

                <label for="statusFilter">
                    Status:
                </label>

                <select id="statusFilter">

                    <option value="All">
                        All
                    </option>

                    <option value="Lost">
                        Lost
                    </option>

                    <option value="Found">
                        Found
                    </option>

                    <option value="Reunited">
                        Reunited
                    </option>

                </select>

            </div>


            <div>

                <label for="areaFilter">
                    Area:
                </label>

                <select id="areaFilter">

                    <option value="All">
                        All Areas
                    </option>

                    <option value="Equipetrol">
                        Equipetrol
                    </option>

                    <option value="Pirai">
                        Pirai
                    </option>

                    <option value="Urubo">
                        Urubo
                    </option>

                    <option value="Sirari">
                        Sirari
                    </option>

                </select>

            </div>

        </section>


        <!-- PET FEED -->

        <section>

            <h2>
                Pet Reports
            </h2>

            <div id="petFeed" class="pet-feed"></div>

        </section>


        <!-- REPORT FORM -->

        <section class="report-section">

            <h2>
                Report a Pet
            </h2>

            <p class="form-introduction">
                Help a lost or found pet by sharing its information.
            </p>


            <form id="reportForm">


                <label for="reportStatus">
                    Status
                </label>

                <select id="reportStatus" required>

                    <option value="">
                        Select status
                    </option>

                    <option value="Lost">
                        Lost
                    </option>

                    <option value="Found">
                        Found
                    </option>

                </select>


                <label for="petName">
                    Pet Name
                </label>

                <input
                    type="text"
                    id="petName"
                    placeholder="Example: Rumba"
                    required
                >


                <label for="species">
                    Species
                </label>

                <select id="species" required>

                    <option value="">
                        Select species
                    </option>

                    <option value="Dog">
                        Dog
                    </option>

                    <option value="Cat">
                        Cat
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="breed">
                    Breed
                </label>

                <input
                    type="text"
                    id="breed"
                    placeholder="Example: Golden Retriever"
                    required
                >


                <label for="imageURL">
                    Image URL
                </label>

                <input
                    type="url"
                    id="imageURL"
                    placeholder="https://example.com/photo.jpg"
                    required
                >

                <p class="image-help">
                    Paste a direct link to the pet's image.
                </p>


                <label for="reportArea">
                    Area
                </label>

                <select id="reportArea" required>

                    <option value="">
                        Select area
                    </option>

                    <option value="Equipetrol">
                        Equipetrol
                    </option>

                    <option value="Pirai">
                        Pirai
                    </option>

                    <option value="Urubo">
                        Urubo
                    </option>

                    <option value="Sirari">
                        Sirari
                    </option>

                </select>


                <label for="contact">
                    Contact Info
                </label>

                <input
                    type="text"
                    id="contact"
                    placeholder="Phone number or email"
                    required
                >


                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe the pet..."
                    required
                ></textarea>


                <button type="submit">
                    🐾 Report Pet
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            Santa Cruz Pet Watch © 2026
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
```
