
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Santa Cruz Pet Watch</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
    <div class="logo">🐾 Santa Cruz Pet Watch</div>
    <p>Helping lost pets find their way home.</p>

    <div class="account-area">
        <span id="userStatus">Not logged in</span>
        <button id="loginButton" class="account-button">Log In</button>
        <button id="logoutButton" class="account-button hidden">Log Out</button>
    </div>
</header>


<main>

    <!-- AREA NAVIGATION -->

    <section class="area-navigation">
        <button class="area-button active" data-area="All">All Areas</button>
        <button class="area-button" data-area="Equipetrol">Equipetrol</button>
        <button class="area-button" data-area="Pirai">Pirai</button>
        <button class="area-button" data-area="Urubo">Urubo</button>
        <button class="area-button" data-area="Sirari">Sirari</button>
    </section>


    <!-- FILTERS -->

    <section class="filters">

        <div>
            <label for="statusFilter">Status:</label>

            <select id="statusFilter">
                <option value="All">All</option>
                <option value="Lost">Lost</option>
                <option value="Found">Found</option>
                <option value="Reunited">Reunited</option>
            </select>
        </div>

        <div>
            <label for="areaFilter">Area:</label>

            <select id="areaFilter">
                <option value="All">All Areas</option>
                <option value="Equipetrol">Equipetrol</option>
                <option value="Pirai">Pirai</option>
                <option value="Urubo">Urubo</option>
                <option value="Sirari">Sirari</option>
            </select>
        </div>

    </section>


    <!-- PET FEED -->

    <section>

        <h2>Pet Reports</h2>

        <div id="loadingMessage">
            Loading pet reports...
        </div>

        <div id="petFeed" class="pet-feed"></div>

    </section>


    <!-- REPORT PET -->

    <section class="report-section">

        <h2>Report a Pet</h2>

        <p id="loginMessage" class="login-message">
            Please log in to report a pet.
        </p>


        <form id="reportForm" class="hidden">

            <label for="reportStatus">Status</label>

            <select id="reportStatus" required>
                <option value="">Select status</option>
                <option value="Lost">Lost</option>
                <option value="Found">Found</option>
            </select>


            <label for="petName">Pet Name</label>

            <input
                type="text"
                id="petName"
                placeholder="Example: Rumba"
                required
            >


            <label for="species">Species</label>

            <select id="species" required>
                <option value="">Select species</option>
                <option value="Dog">Dog</option>
                <option value="Cat">Cat</option>
                <option value="Other">Other</option>
            </select>


            <label for="breed">Breed</label>

            <input
                type="text"
                id="breed"
                placeholder="Example: Golden Retriever"
                required
            >


            <label for="imageURL">Image URL</label>

            <input
                type="url"
                id="imageURL"
                placeholder="https://example.com/pet.jpg"
                required
            >


            <label for="reportArea">Area</label>

            <select id="reportArea" required>

                <option value="">Select area</option>

                <option value="Equipetrol">Equipetrol</option>
                <option value="Pirai">Pirai</option>
                <option value="Urubo">Urubo</option>
                <option value="Sirari">Sirari</option>

            </select>


            <label for="contact">Contact Info</label>

            <input
                type="text"
                id="contact"
                placeholder="Phone number or email"
                required
            >


            <label for="description">Description</label>

            <textarea
                id="description"
                placeholder="Describe the pet..."
                required
            ></textarea>


            <button type="submit">
                🐾 Report Pet
            </button>

        </form>

    </section>

</main>


<footer>
    <p>Santa Cruz Pet Watch © 2026</p>
</footer>


<!-- ACCOUNT MODAL -->

<div id="accountModal" class="modal hidden">

    <div class="modal-content">

        <button id="closeModal" class="close-button">
            ×
        </button>

        <h2 id="accountTitle">Create Account</h2>


        <form id="accountForm">

            <div id="nameField">

                <label for="accountName">
                    Name
                </label>

                <input
                    type="text"
                    id="accountName"
                    placeholder="Your name"
                >

            </div>


            <label for="accountEmail">
                Email
            </label>

            <input
                type="email"
                id="accountEmail"
                placeholder="you@example.com"
                required
            >


            <label for="accountPassword">
                Password
            </label>

            <input
                type="password"
                id="accountPassword"
                placeholder="At least 6 characters"
                minlength="6"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p id="accountSwitchText">
            Already have an account?
        </p>

        <button
            id="switchAccountMode"
            class="switch-button"
        >
            Log In
        </button>


        <p id="accountMessage"></p>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
```
