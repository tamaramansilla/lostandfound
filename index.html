<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Cruz Pet Watch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">🐾 Santa Cruz Pet Watch</div>
        <p>Helping lost pets find their way home.</p>
    </header>

    <main>

        <section class="area-navigation">
            <button class="area-button active" data-area="All">All Areas</button>
            <button class="area-button" data-area="Equipetrol">Equipetrol</button>
            <button class="area-button" data-area="Pirai">Pirai</button>
            <button class="area-button" data-area="Urubo">Urubo</button>
            <button class="area-button" data-area="Sirari">Sirari</button>
        </section>

        <section class="filters">

            <div>
                <label for="statusFilter">Status:</label>
                <select id="statusFilter">
                    <option value="All">All</option>
                    <option value="Lost">Lost</option>
                    <option value="Found">Found</option>
                </select>
            </div>

            <div>
                <label for="areaFilter">Area:</label>
                <select id="areaFilter">
                    <option value="All">All Areas</option>
                    <option value="Equipetrol">Equipetrol</option>
                    <option value="Pirai">Pirai</option>
                    <option value="Urubo">Urubo</option>
                    <option value="Sirari">Sirari</option>
                </select>
            </div>

        </section>

        <section>
            <h2>Pet Reports</h2>
            <div id="petFeed" class="pet-feed"></div>
        </section>

        <section class="report-section">

            <h2>Report a Pet</h2>

            <form id="reportForm">

                <label for="reportStatus">Status</label>
                <select id="reportStatus" required>
                    <option value="">Select status</option>
                    <option value="Lost">Lost</option>
                    <option value="Found">Found</option>
                </select>

                <label for="imageURL">Image URL</label>
                <input
                    type="url"
                    id="imageURL"
                    placeholder="https://example.com/pet.jpg"
                    required
                >

                <label for="reportArea">Area</label>
                <select id="reportArea" required>
                    <option value="">Select area</option>
                    <option value="Equipetrol">Equipetrol</option>
                    <option value="Pirai">Pirai</option>
                    <option value="Urubo">Urubo</option>
                    <option value="Sirari">Sirari</option>
                </select>

                <label for="contact">Contact Info</label>
                <input
                    type="text"
                    id="contact"
                    placeholder="Phone number"
                    required
                >

                <label for="description">Description</label>
                <textarea
                    id="description"
                    placeholder="Describe the pet..."
                    required
                ></textarea>

                <button type="submit">Report Pet</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Santa Cruz Pet Watch © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
